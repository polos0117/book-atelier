<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f4ea">
<title>책의 공방</title>
<link rel="stylesheet" href="lib/workspace.css?v=1">
<script src="lib/workspace-theme.js?v=1"></script>
<script src="lib/words.js?v=1"></script>
<script src="lib/patch.js?v=1"></script>
<script src="lib/fresh.js?v=1"></script>
<script src="lib/img.js?v=1"></script>
<script src="lib/dex-filter.js?v=1"></script>
</head>
<body class="prompt-page lab-page">
<div class="wrap"><div id="app"></div></div>
<script type="module">
import {h,render} from 'https://esm.sh/preact@10.24.3';
import {useState,useEffect,useRef} from 'https://esm.sh/preact@10.24.3/hooks';
import {WorkspaceHeader,ThemeGallery,PAGES} from './lib/workspace-ui.js?v=1';
const W=window.W,IMG=window.AtelierImg,FILTER=window.AtelierDexFilter;
/* 패치 기록 — docs/PATCH.md 를 그대로 읽는다. 열 때 한 번만 받아 온다.
   닫혀 있으면 단추만 그려 집 화면의 자리를 건드리지 않는다. */
function Patch(){
  const [open,setOpen]=useState(false),[log,setLog]=useState(null);
  useEffect(()=>{
    if(!open||log)return;
    fetch(window.AtelierPatch.PATH,{cache:'no-cache'})
      .then(r=>r.ok?r.text():Promise.reject(new Error(String(r.status))))
      .then(t=>setLog({entries:window.AtelierPatch.parse(t)}))
      .catch(()=>setLog({entries:[],failed:true}));
  },[open,log]);
  if(!open)return h('button',{type:'button',class:'patch-open',onClick:()=>setOpen(true)},
    h('span',{'aria-hidden':'true'},'◷'),W('home.patch.open'));
  return h('section',{class:'patch-panel','aria-label':W('home.patch')},
    h('div',{class:'patch-head'},
      h('div',null,h('h3',null,W('home.patch')),h('p',null,W('home.patch.note'))),
      h('button',{type:'button',class:'patch-close',onClick:()=>setOpen(false)},W('home.patch.close'))),
    !log?h('p',{class:'patch-empty'},W('home.patch.loading')):
    log.failed?h('p',{class:'patch-empty'},W('home.patch.fail')):
    !log.entries.length?h('p',{class:'patch-empty'},W('home.patch.none')):
    h('ul',{class:'patch-list'},log.entries.map((e,i)=>
      h('li',{class:'patch-entry',key:i},
        h('div',{class:'patch-when'},h('span',null,e.date),h('span',{class:'patch-who'},e.who)),
        h('strong',null,e.title),
        !!e.items.length&&h('ul',null,e.items.map((x,j)=>h('li',{key:j},x)))))));
}
/* 서재 진열대 — myth-atelier 의 신전 홀에서 왔다. 올라온 책 그림이 낭독대 위 금 고리를 돈다. 그림이 없으면 이름표.
   서가에서 이 서고(테마)에 진열한 책이 있으면 그 차례로, 없으면 그림 있는 책을 무작위로 열둘(여덟이 안 되면 이름표로 채운다).
   한 책에 두 장 — 대표 폼 초상과 그 폼의 개방. '개방 보기' 를 누르면 다 같이 명장면으로 바뀐다 */
const MOTES=[[8,11,0],[17,13,2],[26,9,5],[35,14,1],[44,10,7],[53,12,3],[62,9,6],[71,13,2],[80,11,8],[89,10,4],[95,12,1],[3,14,6]];
function cover(entry,defs,pilot){
  const top=FILTER.best(entry,defs),b=top.style?IMG.styleMap(entry)[top.style]:null;
  if(!b)return {file:null,open:null};
  const forms=Object.keys(defs),stage=pilot&&Object.keys(defs).find(k=>defs[k].stage===pilot.form);
  const order=stage?[stage].concat(forms.filter(k=>k!==stage)):forms;
  const k=order.find(x=>(IMG.formOf(b,x)||{}).f)||order.find(x=>(IMG.formOf(b,x+'_open')||{}).f);
  if(!k)return {file:null,open:null};
  const f=(IMG.formOf(b,k)||{}).f||null,o=(IMG.formOf(b,k+'_open')||{}).f||null;
  return {file:f||o,open:f&&o?o:null};
}
function Hall(){
  const [cards,setCards]=useState(null),[picked,setPicked]=useState(false),[broken,setBroken]=useState({}),[mode,setMode]=useState('base'),box=useRef(null);
  const [theme,setTheme]=useState(()=>IMG.hallTheme());
  useEffect(()=>{const on=()=>setTheme(IMG.hallTheme());addEventListener('atelier-appearance',on);return()=>removeEventListener('atelier-appearance',on);},[]);
  useEffect(()=>{
    let live=true;
    const get=f=>fetch(f,{cache:'no-cache'}).then(r=>r.ok?r.json():{});
    Promise.all([get('data/book-design.json'),IMG.load().catch(()=>({}))]).then(([design,img])=>{
      if(!live)return;
      const fk=(design.vocab||{}).form_key||{},defs={};
      for(const stage of Object.keys(fk))defs[fk[stage]]={stage};
      const all=(design.books||[]).map(b=>({key:b.key,name:b.title,...cover(img[b.key],defs,b.pilot)}));
      const by=Object.fromEntries(all.map(c=>[c.key,c])),mine=IMG.hallPicks(theme).map(k=>by[k]).filter(Boolean);
      const shuffle=l=>{for(let i=l.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[l[i],l[j]]=[l[j],l[i]];}return l;};
      let shot;
      if(mine.length)shot=mine;
      else{
        shot=shuffle(all.filter(c=>c.file)).slice(0,IMG.HALL_MAX);
        const rest=all.filter(c=>!c.file);while(shot.length<8&&rest.length)shot.push(rest.shift());
      }
      setPicked(!!mine.length);setCards(shot);
    }).catch(()=>{if(live)setCards([]);});
    return()=>{live=false};
  },[theme]);
  const tilt=e=>{
    const el=box.current;if(!el)return;
    const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    el.style.setProperty('--ty',(x*10).toFixed(2)+'deg');el.style.setProperty('--tx',(-y*6).toFixed(2)+'deg');
  };
  const rest=()=>{const el=box.current;if(el){el.style.setProperty('--tx','0deg');el.style.setProperty('--ty','0deg');}};
  const n=cards?cards.length:0;
  /* 썸네일이 아직 없으면(막 올린 그림) 원본으로 한 번 더, 그래도 안 되면 이름표 */
  const pic=(c,slot,file)=>h('img',{key:slot,class:(slot===(c.open&&mode==='open'&&!broken[c.key+'open']?'open':'file')?'on':''),src:IMG.thumbURL(file),alt:'',loading:'lazy',decoding:'async',
    onError:e=>{const t=e.currentTarget;if(!t.dataset.full){t.dataset.full='1';t.src=IMG.imgURL(file);return;}setBroken(b=>({...b,[c.key+slot]:true}));}});
  return h('section',{class:'hall',ref:box,'data-mode':mode,'aria-label':W('home.hall'),onPointerMove:tilt,onPointerLeave:rest},
    h('div',{class:'hall-halo','aria-hidden':'true'}),
    h('div',{class:'hall-fog','aria-hidden':'true'}),
    h('div',{class:'hall-scene'},
      /* 책장이 장면의 첫 여섯 자식이어야 한다 — CSS 가 .hall-col:nth-child(1~6) 으로 자리를 준다 */
      [0,1,2,3,4,5].map(i=>h('div',{class:'hall-col',key:i,'aria-hidden':'true'},h('i'))),
      h('div',{class:'hall-floor','aria-hidden':'true'}),
      h('div',{class:'hall-rings','aria-hidden':'true'},h('div',{class:'hall-ring'}),h('div',{class:'hall-ring'}),h('div',{class:'hall-ring'})),
      h('div',{class:'hall-carousel'},(cards||[]).map((c,i)=>{
        const a='--a:'+Math.round(i*360/n)+'deg',href='dex.html?book='+encodeURIComponent(c.key);
        if(!c.file||broken[c.key+'file'])return h('a',{class:'hall-card blank',key:c.key,style:a,href,'data-key':c.key},c.name);
        return h('a',{class:'hall-card',key:c.key,style:a,href,'data-key':c.key,'data-file':c.file},
          pic(c,'file',c.file),c.open&&pic(c,'open',c.open),h('b',null,c.name));
      })),
      MOTES.map(([x,d,w],i)=>h('span',{class:'hall-mote',key:i,'aria-hidden':'true',style:'--x:'+x+'%;--d:'+d+'s;--w:-'+w+'s'}))),
    h('div',{class:'hall-copy'},
      h('div',{class:'eyebrow'},W('home.hall'),h('span',null,' / '+W(mode==='open'?'home.hall.note.open':'home.hall.note'))),
      h('h2',null,W('home.title')),h('p',null,W('home.intro')),
      h('span',{class:'lab-tag'},W('home.tag')),
      h('span',{class:'hall-modes',role:'group','aria-label':W('home.hall.modes')},
        h('button',{type:'button',class:'hall-mode','data-mode':'open','aria-pressed':mode==='open',onClick:()=>setMode(v=>v==='open'?'base':'open')},W('home.hall.open'))),
      h('div',null,h('a',{class:'hall-pick',href:'dex.html'},W(picked?'home.hall.picked':'home.hall.pick',{shelf:W('theme.'+theme)}),' ↗'))));
}
function App(){
  return h('div',null,
    h(WorkspaceHeader,{page:'index'}),
    h(Hall),
    h(Patch),
    h('div',{class:'lab-links'},PAGES.filter(k=>k!=='index').map(key=>
      h('a',{class:'lab-link',href:key+'.html',key},
        h('small',null,W('home.'+key+'.code')),h('h3',null,W('home.'+key+'.title')),
        h('p',null,W('home.'+key+'.note')),h('span',{class:'lab-arrow','aria-hidden':'true'},'↗')))),
    h(ThemeGallery));
}
render(h(App),document.getElementById('app'));
window.AtelierFresh.watch();
</script>
</body>
</html>
