<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f4ea">
<title>책의 공방</title>
<!--
  결투 — 책장 넘기기(docs/DUEL_DESIGN.md). 규칙은 lib/duel.js 에만, 수치는 data/duel.json 에만 있다.
  여기는 상태를 그리고 단추를 엔진에 넘길 뿐이다.

  한 DOM, 두 배치(DUEL_DESIGN 3-8절). 판(.duel-board)은 CSS 그리드 — 영역 이름(bar·hint·foe·me·hand·log·extra)만 방향에 따라 다르게 놓는다:
  · 세로(portrait): 위 = 상대, 아래 = 나, 손패는 맨 아래(바닥에 붙는다). 맞은편 = 위아래 같은 열.
  · 가로(landscape): 펼친 책 — 왼쪽 면 = 나(자리 셋 + 손패), 오른쪽 면 = 상대(자리 셋 + 기록). 발단→전개→결말은 왼쪽→오른쪽.
    맞은편 = 같은 번호(①②③). 휴대폰 가로(높이 400 안팎)에서는 손패 그림을 숨기고 자리 그림을 낮춘다.
  그림이 2:3 세로라 카드가 작다 — 자리·손패마다 ⌕ 로 크게 보기(.duel-zoom), 절정은 화면 가득(.duel-scene).
  한 판 도중 화면을 돌려도 같은 상태(React 상태 + localStorage)를 다른 그리드에 그릴 뿐이다.
  그림은 data/img.json 에 적힌 것만(lib/img.js) — 그 폼의 초상, 절정은 그 폼의 개방 그림. 없으면 이름표.
-->
<!-- 글꼴 — 제목·책등·쪽 번호는 명조(Noto Serif KR), 본문은 고딕(IBM Plex Sans KR). 못 받으면(오프라인·막힘) 기기 글꼴로 그대로 뜬다 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap">
<link rel="stylesheet" href="lib/workspace.css?v=6">
<link rel="stylesheet" href="lib/gallery.css?v=4">
<link rel="stylesheet" href="lib/duel.css?v=1">
<script src="lib/workspace-theme.js?v=3"></script>
<script src="lib/words.js?v=10"></script>
<script src="lib/fresh.js?v=1"></script>
<script src="lib/today.js?v=1"></script>
<script src="lib/speech.js?v=1"></script>
<script src="lib/img.js?v=2"></script>
<script src="lib/dex-filter.js?v=2"></script>
<script src="lib/duel.js?v=1"></script>
<script src="lib/scene-motion.js?v=1"></script>
<link rel="stylesheet" href="lib/scene-motion.css?v=1">
<link rel="stylesheet" href="lib/room.css?v=3">
</head>
<body class="prompt-page duel-page">
<div class="wrap"><div id="app"></div></div>
<script type="module">
import { h, render } from 'https://esm.sh/preact@10.24.3';
import { useState, useEffect, useLayoutEffect, useRef } from 'https://esm.sh/preact@10.24.3/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
import { WorkspaceHeader } from './lib/workspace-ui.js?v=5';
import { useData, picOf, Pic, Match, Scene, Forfeit, Zoom, zoomKey, speak } from './lib/duel-ui.js?v=1';
const html = htm.bind(h);
const W = window.W, D = window.AtelierDuel;
const STORE = 'book_duel_v1', AI_DELAY = 650;
const T = window.AtelierToday, ROOM = 'book';   /* 오늘 기록 — 공방 지도의 방 열쇠(lib/today.js) */
/* 전적 — 통산·연승·오늘의 판 연속은 lib/today.js 의 record(공방 지도도 읽는다), 책마다 몇 판 나가 몇 번 이겼나는 여기(book_duel_rec_v1). 첫 승이 도장 */
const REC = 'book_duel_rec_v1';
function readRec() { try { const j = JSON.parse(localStorage.getItem(REC)); return j && j.books ? j : { books: {} }; } catch (e) { return { books: {} }; } }
function recordBooks(deck, won) { const j = readRec(); for (const k of deck) { const r = j.books[k] || { n: 0, w: 0 }; r.n += 1; if (won) r.w += 1; j.books[k] = r; } try { localStorage.setItem(REC, JSON.stringify(j)); } catch (e) {} }
function readStore() { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } }
function writeStore(o) { try { localStorage.setItem(STORE, JSON.stringify(o)); } catch (e) {} }

function Deck({ S, deck, onChange, onStart, onDaily }) {
  const data = S.data, max = D.DECK, v = D.validateDeck(data, deck), today = T.read(ROOM);
  const life = T.record(ROOM), rec = readRec().books, wonBooks = data.design.books.filter(b => (rec[b.key] || {}).w > 0).length;
  const toggle = key => onChange(deck.includes(key) ? deck.filter(k => k !== key) : deck.length < max ? deck.concat(key) : deck);
  return html`<section class="duel-screen" data-screen="deck">
    <p class="sec">${W('duel.deck.title')}<span>${W('duel.deck.count', { n: deck.length, max })}</span></p>
    <p class="note">${W('duel.deck.note')}</p>
    <div class="deck-rec" data-games=${life.n}>
      <p class="sec">${W('duel.rec.title')}</p>
      <p class="note">${life.n ? W('duel.rec.line', { n: life.n, w: life.w, rate: Math.round(life.w / life.n * 100), streak: life.streak, best: life.best }) : W('duel.rec.none')}${life.dstreak > 0 && T.dailyAlive(ROOM) ? ' · ' + W('duel.rec.daily', { d: life.dstreak }) : ''}</p>
      <p class="note">${W('duel.rec.books', { n: wonBooks, max: data.design.books.length })}</p>
    </div>
    <div class="deck-grid">${data.design.books.map(b => {
      const file = picOf(S, b.key, 0), roles = S.stages.map(s => b.forms[s].role), r = rec[b.key] || { n: 0, w: 0 };
      return html`<button key=${b.key} type="button" class=${'deck-cell' + (deck.includes(b.key) ? ' in' : '') + (r.w > 0 ? ' won' : '')} data-key=${b.key} aria-pressed=${deck.includes(b.key)} onClick=${() => toggle(b.key)}>
        <span class="face"><${Pic} file=${file} alt=${b.title} />${r.w > 0 && html`<b class="stamp" aria-hidden="true">✓</b>`}</span>
        <span class="cap">${b.title}<i>${b.genre}</i><i>${W('duel.deck.role', { a: roles[0], b: roles[1], c: roles[2] })}</i>${r.n > 0 && html`<i class="rec">${W('duel.rec.cell', { n: r.n, w: r.w })}</i>`}</span>
      </button>`; })}</div>
    <div class="deck-act">
      <button type="button" class="btn" id="duel-auto" onClick=${() => onChange(D.randomDeck(data, { rngState: (Date.now() ^ (Math.random() * 1e9)) | 0 }))}>${W('duel.deck.auto')}</button>
      <button type="button" class="btn" id="duel-clear" disabled=${!deck.length} onClick=${() => onChange([])}>${W('duel.deck.clear')}</button>
      <span class="n">${W('duel.deck.count', { n: deck.length, max })}</span>
    </div>
    <button type="button" class="btn primary" id="duel-start" disabled=${!v.ok} onClick=${onStart} style="width:100%">${W('duel.deck.start')}</button>
    <div class="deck-daily" data-done=${today.daily}>
      <button type="button" class="btn" id="duel-daily" disabled=${!v.ok} onClick=${onDaily}>${W('duel.deck.daily')}</button>
      <p class="note">${today.daily ? W('duel.deck.daily.done') : W('duel.deck.daily.note')}${today.n > 0 ? ' · ' + W('duel.deck.today', { n: today.n, w: today.w }) : ''}</p>
    </div>
  </section>`;
}

/* 판 위 책 한 칸 — 누르는 단추(.pick)와 크게 보기(.zoom)가 나란히(단추 안에 단추를 두지 않는다) */
function App() {
  const S = useData();
  const [game, setGame] = useState(() => { const s = readStore(); return { deck: Array.isArray(s.deck) ? s.deck : [], st: s.st && s.st.v === D.VERSION ? s.st : null, screen: s.st && s.st.v === D.VERSION ? 'match' : 'deck' }; });
  const [scene, setScene] = useState(null), [zoom, setZoom] = useState(null), [forfeit, setForfeit] = useState(false);
  const timer = useRef(null);
  const save = g => { writeStore({ deck: g.deck, st: g.st }); return g; };
  /* 절정이 터졌으면 장면을 보인다 — 내 것도 상대 것도 */
  const showScene = st => { if (st.last && st.last.kind === 'open') setScene({ key: st.last.key, form: st.last.form, who: st.last.who }); };
  /* 판이 끝나는 수에서 오늘 기록 한 칸(공방 지도가 읽는다) — st.recorded 가 두 번을 막는다 */
  const commit = st => { if (st.phase === 'done' && !st.recorded) { st.recorded = true; T.bump(ROOM, { won: st.winner === 'me', daily: !!st.daily }); recordBooks(game.deck, st.winner === 'me'); } setGame(g => save({ ...g, st })); showScene(st); speak(S, st); };
  /* 상대 차례는 조금 쉬었다 둔다 — 사람이 따라 읽게. 절정 장면·판 접기 확인이 떠 있으면 닫을 때까지 기다린다 */
  useEffect(() => {
    if (scene || forfeit || !S.data || !game.st || game.st.phase !== 'play' || game.st.turn !== 'foe') return;
    clearTimeout(timer.current);
    timer.current = setTimeout(() => { const st = JSON.parse(JSON.stringify(game.st)); D.aiTurn(S.data, st, 'greedy'); commit(st); }, AI_DELAY);
    return () => clearTimeout(timer.current);
  }, [S.data, game.st, scene, forfeit]);
  useEffect(() => { if (zoom && (!game.st || !zoomKey(game.st, zoom))) setZoom(null); }, [zoom, game.st]);
  /* 오늘의 판 — 날짜가 씨앗이라 상대 덱·섞인 순서가 하루 동안 같다. 끝내면 오늘 기록에 daily 가 선다 */
  const start = (deck, daily) => {
    const seed = daily ? T.seed(ROOM) : (Date.now() ^ (Math.random() * 1e9)) | 0, rng = { rngState: seed };
    const st = D.newMatch(S.data, { me: deck, foe: D.randomDeck(S.data, rng) }, seed);
    if (daily) st.daily = true;
    setScene(null); setZoom(null); setForfeit(false); setGame(save({ deck, st, screen: 'match' }));
  };
  /* 지도에서 ?daily 로 왔고 덱이 갖춰져 있으면 바로 오늘의 판. 다녀간 자국은 늘 남긴다 */
  useEffect(() => { if (!S.data) return; T.visit(ROOM); if (T.isDaily() && !game.st && D.validateDeck(S.data, game.deck).ok) start(game.deck, true); }, [S.data]);
  const toDeck = () => { clearTimeout(timer.current); setScene(null); setZoom(null); setGame(g => save({ ...g, st: null, screen: 'deck' })); };
  const move = m => { const st = JSON.parse(JSON.stringify(game.st)); const r = D.step(S.data, st, m); if (!r.ok) return; commit(st); };
  if (S.error) return html`<${WorkspaceHeader} page="duel" /><p class="empty-msg">${W('ui.error', { message: S.error })}</p>`;
  if (!S.data) return html`<${WorkspaceHeader} page="duel" /><p class="empty-msg">${W('ui.loading')}</p>`;
  return html`<${WorkspaceHeader} page="duel" />
    ${game.screen === 'match' && game.st
      ? html`<${Match} S=${S} st=${game.st} onMove=${move} onZoom=${setZoom} onForfeit=${() => setForfeit(true)} actions=${html`<div class="acts"><button type="button" class="btn primary" id="duel-again" onClick=${() => start(game.deck)}>${W('duel.result.again')}</button><button type="button" class="btn" id="duel-deck" onClick=${toDeck}>${W('duel.result.deck')}</button></div>`} />`
      : html`<${Deck} S=${S} deck=${game.deck} onChange=${deck => setGame(g => save({ ...g, deck }))} onStart=${() => start(game.deck)} onDaily=${() => start(game.deck, true)} />`}
    ${zoom && game.st && zoomKey(game.st, zoom) && html`<${Zoom} S=${S} st=${game.st} zoom=${zoom} onClose=${() => setZoom(null)} />`}
    ${scene && html`<${Scene} S=${S} scene=${scene} onClose=${() => setScene(null)} />`}
    ${forfeit && game.st && html`<${Forfeit} onNo=${() => setForfeit(false)} onYes=${() => { setForfeit(false); toDeck(); }} />`}`;
}
render(html`<${App} />`, document.getElementById('app'));
window.AtelierFresh.watch();
</script>
</body>
</html>
